name: build

# Manual only: no pull request, fork or push trigger. The source is private and is read through a read-only App token.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit of the source to build
        required: true
        type: string
      tag:
        description: Release tag to publish, for example wrapper-0.1.0
        required: true
        type: string

permissions: {}

concurrency:
  group: build
  cancel-in-progress: false

env:
  SHA: ${{ inputs.sha }}

jobs:
  check-input:
    runs-on: ubuntu-latest
    permissions: {}
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Validate the inputs
        run: |
          case "$SHA" in *[!0-9a-f]*|"") echo "sha must be lowercase hex"; exit 1;; esac
          [ "${#SHA}" = 40 ] || { echo "sha must be 40 characters"; exit 1; }
          case "$TAG" in *[!A-Za-z0-9._-]*|"") echo "bad tag"; exit 1;; esac

  linux:
    needs: check-input
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_KEY }}
          owner: termenbox
          repositories: termenbox-source
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: termenbox/termenbox-source
          ref: ${{ inputs.sha }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter termenbox-client run build
      - run: pnpm --filter termenbox-native run sync:electron
      - name: Build the AppImage
        working-directory: packages/native/electron
        run: |
          npm ci --no-audit --no-fund
          npm run electron:make
      - name: Collect
        run: |
          mkdir -p out
          cp packages/native/electron/dist/*.AppImage out/Termenbox-linux-x64.AppImage
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: out/
          if-no-files-found: error

  windows:
    needs: check-input
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_KEY }}
          owner: termenbox
          repositories: termenbox-source
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: termenbox/termenbox-source
          ref: ${{ inputs.sha }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter termenbox-client run build
      - run: pnpm --filter termenbox-native run sync:electron
      - name: Build the installer
        working-directory: packages/native/electron
        run: |
          npm ci --no-audit --no-fund
          npm run electron:make
      - name: Collect
        run: |
          mkdir -p out
          cp packages/native/electron/dist/*.exe out/Termenbox-windows-x64-setup.exe
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: out/
          if-no-files-found: error

  android:
    needs: check-input
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_KEY }}
          owner: termenbox
          repositories: termenbox-source
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: termenbox/termenbox-source
          ref: ${{ inputs.sha }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: '21'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter termenbox-client run build
      - run: pnpm --filter termenbox-native run sync:android
      - name: Build the unsigned release APK
        working-directory: packages/native/android
        run: ./gradlew --no-daemon assembleRelease
      - name: Collect
        run: |
          mkdir -p out
          cp packages/native/android/app/build/outputs/apk/release/*.apk out/Termenbox-android-unsigned.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: android
          path: out/
          if-no-files-found: error

  # The only job that sees a signing key. It runs after an owner approves the `stable` Environment.
  publish:
    needs: [linux, windows, android]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: stable
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag }}
      GPG_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
      GPG_PASS: ${{ secrets.LINUX_GPG_PASSPHRASE }}
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: in
      - name: Sign the AppImage and the APK, then publish
        run: |
          set -eu
          [ -n "$GPG_KEY" ] && [ -n "$KS_B64" ] || { echo "the Linux key and the Android keystore must be in the stable Environment"; exit 1; }
          mkdir out
          cp in/linux/Termenbox-linux-x64.AppImage in/windows/Termenbox-windows-x64-setup.exe out/

          # Linux: detached signature
          export GNUPGHOME="$RUNNER_TEMP/gnupg"; mkdir -m 700 "$GNUPGHOME"
          printf '%s' "$GPG_KEY" | base64 -d | gpg --batch --quiet --import
          gpg --batch --yes --pinentry-mode loopback --passphrase-fd 3 --armor --detach-sign \
            -o out/Termenbox-linux-x64.AppImage.asc out/Termenbox-linux-x64.AppImage 3<<<"$GPG_PASS"
          gpg --armor --export > out/termenbox-native.asc

          # Android: align, then sign with the upload key
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/zipalign" -f -p 4 in/android/Termenbox-android-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/up.jks"
          "$bt/apksigner" sign --ks "$RUNNER_TEMP/up.jks" --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PASS \
            --out out/Termenbox-android.apk "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify out/Termenbox-android.apk
          rm -f "$RUNNER_TEMP/up.jks"

          (cd out && sha256sum * > SHA256SUMS)
          {
            echo "Built from source commit \`$SHA\`."
            echo
            echo "- Linux AppImage: signed (\`.asc\`, key \`termenbox-native.asc\`)."
            echo "- Android APK: signed with the Termenbox upload key."
            echo "- Windows installer: **not yet signed**; Windows will warn about an unknown publisher. Check it against \`SHA256SUMS\`."
            echo
            echo '```'; cat out/SHA256SUMS; echo '```'
          } > notes.md
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --prerelease
