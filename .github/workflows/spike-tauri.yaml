name: spike-tauri

# Manual only, like `build`. Measures a bare Tauri shell on Windows: prints sizes, publishes nothing, signs nothing.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit of the source to build
        required: true
        type: string

permissions: {}

env:
  SHA: ${{ inputs.sha }}

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate the input
        run: |
          case "$SHA" in *[!0-9a-f]*|"") echo "sha must be lowercase hex"; exit 1;; esac
          [ "${#SHA}" = 40 ] || { echo "sha must be 40 characters"; exit 1; }
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.SOURCE_APP_ID }}
          private-key: ${{ secrets.SOURCE_APP_KEY }}
          owner: termenbox
          repositories: termenbox-source
          permission-contents: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: termenbox/termenbox-source
          ref: ${{ inputs.sha }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 10
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter termenbox-client run build
      - name: Icons, and no source maps
        run: |
          pnpm --filter termenbox-native run build:assets
          mkdir -p packages/native/tauri/src-tauri/icons
          cp packages/native/electron/assets/appIcon.ico packages/native/tauri/src-tauri/icons/icon.ico
          node packages/native/scripts/strip-maps.mjs packages/client/dist
      - name: Build the installer
        working-directory: packages/native/tauri/src-tauri
        run: npx --yes @tauri-apps/cli@2.8.4 build
      - name: Sizes
        working-directory: packages/native/tauri/src-tauri
        run: |
          ls -l target/release/bundle/nsis/*.exe target/release/*.exe
          du -sk ../../../client/dist | awk '{printf "client dist: %.1f MB\n", $1/1024}'
          echo "### Tauri spike sizes" >> "$GITHUB_STEP_SUMMARY"
          for f in target/release/bundle/nsis/*.exe target/release/termenbox-tauri.exe; do
            echo "- $(basename "$f"): $(( $(wc -c < "$f") / 1024 )) KB" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tauri-windows
          path: packages/native/tauri/src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 3
          if-no-files-found: error
